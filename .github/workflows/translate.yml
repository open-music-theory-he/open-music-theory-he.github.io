name: Translate Music Theory Book

on:
  workflow_dispatch: # מאפשר הפעלה ידנית מתוך לשונית Actions בגיטהאב

jobs:
  translate:
    runs-on: ubuntu-latest
    # הוספת הרשאות כתיבה עבור ה-Token של ה-Action
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # תוקן גם כפל המילה node-node-version שהיה במקור

      - name: Install dependencies
        run: npm install @google/generative-ai

      - name: Run translation script
        env:
          GROQ_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
        run: node scripts/translate-book.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Automated translation with Groq and updated logs" || echo "No changes to commit"
          git push
